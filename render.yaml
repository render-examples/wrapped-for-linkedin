projects:
  - name: wrapped-for-linkedin
    environments:
      - name: production
        services:
          - type: web
            name: wrappedforlinkedin
            runtime: static
            rootDir: site
            buildCommand: npm ci && npm run build
            staticPublishPath: ./dist
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              # React sets style attributes, so style-src needs 'unsafe-inline'.
              # The image export draws data: and blob: images and fetches a data: URL to make a file.
              # If you change the screenshot service URL, change connect-src too.
              - path: /*
                name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://wrapped-for-linkedin-screenshots.onrender.com data: blob:; frame-src https://www.linkedin.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
            envVars:
              - key: NODE_VERSION
                value: "22"
              # fromService gives only the private network hostname, which a browser cannot reach.
              # Use the public URL of the screenshot service.
              - key: VITE_SCREENSHOT_SERVICE_URL
                value: https://wrapped-for-linkedin-screenshots.onrender.com

          - type: web
            name: wrapped-for-linkedin-screenshots
            runtime: docker
            # Chromium needs about 1 GB of memory.
            plan: standard
            dockerfilePath: ./screenshot-service/Dockerfile
            dockerContext: ./screenshot-service
            healthCheckPath: /healthz
            envVars:
              - key: ALLOWED_ORIGINS
                value: https://wrappedforlinkedin.onrender.com
